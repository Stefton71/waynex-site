<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Waynex — Area riservata</title>
  <link rel="icon" href="/assets/app-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=11">
  <script defer src="unlock.js?v=1"></script>
</head>
<body class="costi-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <img src="/assets/app-icon.png" alt="" width="36" height="36">
        </span>
        Waynex
      </a>
      <div class="header-right">
        <button type="button" class="costi-logout" id="logout">Esci</button>
      </div>
    </div>
  </header>

  <main class="costi-main">
    <section class="costi-gate" id="gate">
      <h1>Area riservata</h1>
      <p>Questa pagina è cifrata. Senza utente e password il contenuto non è leggibile.</p>
      <form id="gate-form">
        <label for="username">Nome utente</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entra</button>
        <p class="costi-error" id="gate-error" hidden>Nome utente o password non corretti.</p>
      </form>
    </section>
    <div id="app" hidden></div>
  </main>
</body>
</html>
