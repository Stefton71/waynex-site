<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waynex</title>
  <meta name="description" content="Waynex – Organizza i tuoi viaggi in modo semplice.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f9;
      color: #1d1d1f;
    }

    main {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .content {
      max-width: 700px;
    }

    h1 {
      font-size: 64px;
      margin: 0 0 15px;
    }

    h2 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 25px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }

    footer a {
      color: #333;
      margin: 0 12px;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 46px;
      }

      h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="content">
      <h1>Waynex</h1>
      <h2>Il tuo viaggio. Tutto in un unico posto.</h2>

      <p>
        Waynex ti aiuta a organizzare itinerari, luoghi, documenti e spese
        di viaggio in modo semplice e intuitivo.
      </p>

      <p>
        L'app Waynex sarà presto disponibile.
      </p>
    </div>
  </main>

  <footer>
    <a href="mailto:info@wainex.it">Contatti</a>
    <a href="#">Privacy Policy</a>
  </footer>

</body>
</html>
